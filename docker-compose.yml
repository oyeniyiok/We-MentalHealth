version: "3.8"

services:
  web:
    build: .
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Webroot for Let's Encrypt HTTP-01 challenges. certbot writes the
      # challenge file on the host; nginx serves it from /.well-known/.
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    volumes:
      - backend_data:/app/data
    restart: unless-stopped

volumes:
  backend_data:
