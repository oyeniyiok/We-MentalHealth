# Canonical host is the bare apex: https://we-mentalhealth.org
# Everything else (www, the old duckdns host, plain HTTP) redirects to it.

# ---- HTTP: ACME validation, then redirect everything ----
server {
    listen 80;
    server_name we-mentalhealth.org www.we-mentalhealth.org wementalhealth.duckdns.org;

    # Let's Encrypt HTTP-01 validation. This has to be served over plain HTTP
    # and must come before the redirect below, or certbot renewal fails:
    # the challenge would be bounced to HTTPS, where the webroot is baked into
    # the image and certbot cannot write to it.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://we-mentalhealth.org$request_uri;
    }
}

# ---- HTTPS: the old duckdns host, kept alive purely to redirect ----
# Anything already indexed or shared under the old name lands on the new one
# with its path intact. Needs the old certificate to stay renewed; once the
# old links have died off, this block and that certificate can go.
server {
    listen 443 ssl;
    server_name wementalhealth.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/wementalhealth.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wementalhealth.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://we-mentalhealth.org$request_uri;
}

# ---- HTTPS: www -> apex, so only one version is indexable ----
server {
    listen 443 ssl;
    server_name www.we-mentalhealth.org;

    ssl_certificate     /etc/letsencrypt/live/we-mentalhealth.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/we-mentalhealth.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://we-mentalhealth.org$request_uri;
}

# ---- HTTPS: the site itself ----
server {
    listen 443 ssl;
    server_name we-mentalhealth.org;

    ssl_certificate     /etc/letsencrypt/live/we-mentalhealth.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/we-mentalhealth.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Forward API calls to the Flask backend container
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin pages also live on the backend
    location /admin {
        proxy_pass http://backend:5000/admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

